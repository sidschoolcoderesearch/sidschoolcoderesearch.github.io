<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totally Normal Website</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive;
    background: #fff4e6;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .tiny { font-size: 0.7rem; color: #999; margin-top: 24px; }

  /* --- the bird page --- */
  body.robbed {
    background: url("robin.webp") 0 0 / 160px 160px repeat;
    animation: scroll-bg 6s linear infinite;
  }
  #reveal { display: none; text-align: center; padding: 16px; width: 100%; max-width: 560px; }
  body.robbed #reveal { display: block; }

  .card {
    background: white;
    border: 6px solid #ff6a00;
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    animation: slam 0.5s cubic-bezier(.2,1.6,.4,1);
  }
  .card h1 { margin: 0; font-size: clamp(1.6rem, 7vw, 2.8rem); color: #e04e00; }
  .card img {
    width: 100%;
    max-width: 360px;
    border-radius: 50%;
    margin: 12px 0;
    animation: puff 0.9s ease-in-out infinite;
  }
  .card p { margin: 6px 0; }
  #counter { font-weight: bold; }

  #close {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: #222;
    color: white;
    font-size: 1.6rem;
    cursor: pointer;
    transition: top 0.15s, left 0.15s, right 0.15s;
    display: none;
    z-index: 10;
  }
  body.robbed #close { display: block; }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 10px 18px;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 11;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  #toast.show { opacity: 1; }

  footer { margin-top: 12px; font-size: 0.9rem; }
  footer a { color: #e04e00; }

  .card button {
    font: inherit;
    font-size: 1.1rem;
    margin: 8px 4px 0;
    padding: 10px 20px;
    border: none;
    border-radius: 999px;
    background: #ff6a00;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 0 #b34a00;
  }
  .card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b34a00; }

  /* the bird cursor */
  body.robbed, body.robbed * {
    cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='26' font-size='26'>🐦</text></svg>") 4 4, auto;
  }

  /* fake pop-up windows inside the page */
  .win {
    position: fixed;
    width: 200px;
    background: #fff4e6;
    border: 2px solid #222;
    border-radius: 10px;
    box-shadow: 4px 6px 0 rgba(0,0,0,0.4);
    overflow: hidden;
    z-index: 5;
    animation: pop 0.25s cubic-bezier(.2,1.6,.4,1);
    font-size: 0.85rem;
  }
  .win .bar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #ff6a00;
    color: white;
    padding: 4px 6px;
    user-select: none;
  }
  .win .bar span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .bar button {
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 0.8rem;
    line-height: 20px;
    padding: 0;
  }
  .win img { display: block; width: 100%; animation: puff 0.8s ease-in-out infinite; }
  .win p { margin: 4px; text-align: center; }

  /* the "bird has fallen" box */
  #revenge {
    display: none;
    position: fixed;
    inset: 0;
    margin: auto;
    height: fit-content;
    width: min(340px, calc(100% - 32px));
    background: white;
    border: 6px solid #e04e00;
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    z-index: 20;
  }
  #revenge.show { display: block; animation: slam 0.4s cubic-bezier(.2,1.6,.4,1); }
  #revenge h2 { margin: 0 0 8px; color: #e04e00; }
  #revenge p { margin: 0 0 12px; }
  #revenge button {
    font: inherit;
    font-size: 1.2rem;
    padding: 10px 36px;
    border: none;
    border-radius: 999px;
    background: #ff6a00;
    color: white;
    box-shadow: 0 4px 0 #b34a00;
  }

  @keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg) scale(1.05); }
  }
  @keyframes puff {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08, 1.12); }
  }
  @keyframes slam {
    from { transform: scale(0.2) rotate(-20deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes scroll-bg {
    from { background-position: 0 0; }
    to { background-position: 160px 160px; }
  }
</style>
</head>
<body>

  <div id="reveal">
    <div class="card">
      <h1>THE APOCALYPSE IS STARTING 🐦</h1>
      <img src="robin.webp" alt="A very round, very angry robin">
      <p>He is round. He is angry. He is <b>always watching</b>.</p>
      <p id="counter"></p>
      <button id="flock">🐦 Summon the flock</button>
      <p class="tiny" style="margin-top:8px">(allow pop-ups for the full bird experience)</p>
    </div>
    <footer class="card" style="animation:none; margin-top:12px;">
      Find my other projects on my <a href="https://github.com/sidschoolcoderesearch">GitHub page</a>!
    </footer>
  </div>

  <button id="close" aria-label="Close">×</button>
  <div id="toast"></div>

  <div id="revenge">
    <h2 id="revenge-title"></h2>
    <p id="revenge-text"></p>
    <button id="revenge-ok">OK</button>
  </div>

<script>
  const closeButton = document.getElementById("close");
  const toast = document.getElementById("toast");
  const counter = document.getElementById("counter");

  // Things the bird says when you try to escape
  const escapeMessages = [
    "nope 🐦",
    "the robin says no thankyou i want to stay",
    "you cannot escape the round one",
    "he is faster than you",
    "fine. FINE. close it then.",
  ];
  let escapeTries = 0;
  let timesRobbed = 0;

  // Make a little chirp sound (no sound file needed)
  function chirp() {
    try {
      const audio = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 3; i++) {
        const start = audio.currentTime + i * 0.12;
        const tone = audio.createOscillator();
        const volume = audio.createGain();
        tone.type = "sine";
        tone.frequency.setValueAtTime(2500, start);
        tone.frequency.exponentialRampToValueAtTime(4200, start + 0.08);
        volume.gain.setValueAtTime(0.15, start);
        volume.gain.exponentialRampToValueAtTime(0.001, start + 0.1);
        tone.connect(volume).connect(audio.destination);
        tone.start(start);
        tone.stop(start + 0.1);
      }
    } catch (e) {
      // no sound, no problem
    }
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove("show"), 1500);
  }

  function robinRoll() {
    timesRobbed++;
    escapeTries = 0;
    counter.textContent = "Apocalypse level: " + timesRobbed;
    closeButton.style.left = "";
    closeButton.style.top = "20px";
    closeButton.style.right = "20px";
    document.body.classList.add("robbed");
    // restart the slam animation each time
    const card = document.querySelector(".card");
    card.style.animation = "none";
    card.offsetHeight;
    card.style.animation = "";
    chirp();
  }

  // The close button runs away a few times before it lets you click it
  function runAway() {
    if (escapeTries >= escapeMessages.length - 1) return;
    const x = Math.random() * (window.innerWidth - 60) + 6;
    const y = Math.random() * (window.innerHeight - 60) + 6;
    closeButton.style.right = "auto";
    closeButton.style.left = x + "px";
    closeButton.style.top = y + "px";
    showToast(escapeMessages[escapeTries]);
    escapeTries++;
  }

  // --- fake pop-up windows of the bird ---
  // Closing one makes two more appear, until there are too many and he gives up
  const titles = ["HE IS ROUND", "bird.exe", "chirp.mp3", "not a virus (bird)", "round_boy.webp", "LOOK AT HIM", "error: too round"];
  const winLines = ["hello.", "i am round.", "close me. i dare you.", "i have friends.", "chirp.", "he sees you."];
  const maxWindows = 25;
  let windowCount = 0;
  let flockDone = false;

  function pick(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function spawnWindow() {
    if (flockDone || !document.body.classList.contains("robbed")) return;
    if (windowCount >= maxWindows) {
      flockDone = true;
      showToast("ok fine. the flock is tired. 🐦💤");
      setTimeout(() => {
        document.querySelectorAll(".win").forEach((w) => w.remove());
        windowCount = 0;
        flockDone = false;
      }, 1500);
      return;
    }
    windowCount++;
    const win = document.createElement("div");
    win.className = "win";
    win.style.left = Math.random() * Math.max(0, window.innerWidth - 200) + "px";
    win.style.top = Math.random() * Math.max(0, window.innerHeight - 250) + "px";
    win.innerHTML = `
      <div class="bar"><span>${pick(titles)}</span><button aria-label="Close">×</button></div>
      <img src="robin.webp" alt="A round robin">
      <p>${pick(winLines)}</p>`;
    win.querySelector("button").addEventListener("click", () => {
      win.remove();
      chirp();
      spawnWindow();
      setTimeout(spawnWindow, 150);
    });
    document.body.appendChild(win);
  }

  // Opens a real bird window (bird.html). Each bird window can open its own children.
  // If the browser blocks pop-ups, fake windows appear inside the page instead.
  function openBirdWindow() {
    const x = Math.floor(Math.random() * (screen.availWidth - 300));
    const y = Math.floor(Math.random() * (screen.availHeight - 300));
    return window.open("bird.html", "_blank", `popup,width=280,height=300,left=${x},top=${y}`);
  }

  document.getElementById("flock").addEventListener("click", () => {
    chirp();
    const popup = openBirdWindow();
    if (!popup) {
      showToast("pop-ups blocked 😤 the flock will live here instead");
      for (let i = 0; i < 4; i++) setTimeout(spawnWindow, i * 250);
    }
  });

  // --- when a bird window is closed, his cousins want revenge ---
  // The OK button has to be clicked twice, then two new bird windows fly out
  const revenge = document.getElementById("revenge");
  const revengeTitle = document.getElementById("revenge-title");
  const revengeText = document.getElementById("revenge-text");
  const revengeOk = document.getElementById("revenge-ok");
  let okClicks = 0;

  // Each bird window says hello and holds a lock; we get the lock when it closes
  new BroadcastChannel("birds").addEventListener("message", (event) => {
    if (!event.data || !event.data.hello) return;
    const generation = event.data.generation;
    navigator.locks.request("bird-" + event.data.hello, () => birdFell(generation));
  });

  function birdFell(generation) {
    timesRobbed++;
    counter.textContent = "Apocalypse level: " + timesRobbed;
    okClicks = 0;
    revengeTitle.textContent = "bird #" + generation + " has fallen… 💀";
    revengeText.textContent = "his cousins are coming for revenge 😤";
    revengeOk.textContent = "OK";
    revenge.classList.remove("show");
    revenge.offsetHeight;
    revenge.classList.add("show");
    chirp();
  }

  revengeOk.addEventListener("click", () => {
    okClicks++;
    if (okClicks === 1) {
      revengeText.textContent = "are you sure? he had a family.";
      revengeOk.textContent = "OK (for real)";
      return;
    }
    revenge.classList.remove("show");
    chirp();
    // Browsers usually allow only one new window per click,
    // so if the second one is blocked, a fake bird window shows up instead
    const first = openBirdWindow();
    const second = openBirdWindow();
    if (!first) spawnWindow();
    if (!second) spawnWindow();
    const third = openBirdWindow();
    const forth = openBirdWindow();
    if (!third) spawnWindow();
    if (!forth) spawnWindow();
    
  });

  // The bird is there from the start
  robinRoll();
  closeButton.addEventListener("mouseenter", runAway);
  closeButton.addEventListener("touchstart", (e) => {
    if (escapeTries < escapeMessages.length - 1) {
      e.preventDefault();
      runAway();
    }
  });
  closeButton.addEventListener("click", () => {
    if (escapeTries < escapeMessages.length - 1) {
      runAway();
      return;
    }
    showToast(escapeMessages[escapeMessages.length - 1]);
    document.body.classList.remove("robbed");
    document.querySelectorAll(".win").forEach((w) => w.remove());
    windowCount = 0;
    // ...but the robin says no thankyou i want to stay
    setTimeout(() => {
      showToast("the robin says no thankyou i want to stay");
      robinRoll();
    }, 2500);
  });
</script>
</body>
</html>
