<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐦 HE IS ROUND</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff4e6;
    font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive;
    text-align: center;
    overflow: hidden;
  }
  img {
    width: 60vmin;
    border-radius: 50%;
    animation: puff 0.7s ease-in-out infinite;
  }
  p { margin: 8px; font-weight: bold; color: #e04e00; }
  button {
    font: inherit;
    padding: 8px 16px;
    border: none;
    border-radius: 999px;
    background: #ff6a00;
    color: white;
    cursor: pointer;
  }
  @keyframes puff {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08, 1.12); }
  }
</style>
</head>
<body>
  <img src="robin.webp" alt="A very round robin">
  <p id="line">hello.</p>
  <button id="more">🐦 FAT BIRD APOCALYPSE 🐦</button>

<script>
  const lines = ["hello.", "i am round.", "i live here now.", "do not look away.", "chirp.", "i have brought friends."];
  document.getElementById("line").textContent = lines[Math.floor(Math.random() * lines.length)];

  // Which generation this bird is (the first window is 1, its children are 2, ...)
  const generation = Number(new URLSearchParams(location.search).get("gen")) || 1;
  document.title = "🐦 bird #" + generation + (generation > 1 ? " (child of #" + (generation - 1) + ")" : "");

  // Clicking anywhere in this window opens one child bird window
  // (browsers only allow one new window per click)
  document.addEventListener("click", () => {
    const x = Math.floor(Math.random() * (screen.availWidth - 300));
    const y = Math.floor(Math.random() * (screen.availHeight - 300));
    window.open("bird.html?gen=" + (generation + 1), "_blank", `popup,width=280,height=300,left=${x},top=${y}`);
  });

  function isFullscreenNow() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement ||
      window.matchMedia("(display-mode: fullscreen)").matches
    );
  }

  function applyFullscreenTrap() {
    if (!isFullscreenNow()) return;

    const existing = document.getElementById("birdFullscreenMask");
    if (existing) return;

    const mask = document.createElement("div");
    mask.id = "birdFullscreenMask";
    Object.assign(mask.style, {
      position: "fixed",
      inset: "0",
      width: "100vw",
      height: "100vh",
      margin: "0",
      padding: "0",
      background: "#fff4e6",
      zIndex: "2147483647",
      overflow: "hidden",
      pointerEvents: "auto",
      boxSizing: "border-box"
    });

    mask.innerHTML = `
      <div id="birdFullscreenLayer" style="
        position:absolute;
        inset:0;
        width:100vw;
        height:100vh;
        background:#fff4e6;
        overflow:hidden;
      ">
        <div id="birdFullscreenWindow" style="
          position:absolute;
          left:50px;
          top:50px;
          width:280px;
          height:300px;
          background:#fffaf2;
          border:2px solid #222;
          border-radius:12px;
          box-shadow:0 12px 28px rgba(0,0,0,.28);
          overflow:hidden;
        ">
          <div style="
            height:28px;
            background:#ff6a00;
            color:white;
            font-weight:bold;
            display:flex;
            align-items:center;
            justify-content:center;
            user-select:none;
          ">🐦</div>
          <img src="robin.webp" alt="A round robin" style="display:block; width:100%; height:calc(100% - 28px); object-fit:cover;">
        </div>
      </div>
    `;

    document.body.appendChild(mask);

    let x = 50, y = 50;
    let dx = 12, dy = 8;
    const bird = document.getElementById("birdFullscreenWindow");

    const tickBird = () => {
      x += dx;
      y += dy;

      if (x <= 0 || x + 280 >= window.innerWidth) dx *= -1;
      if (y <= 0 || y + 300 >= window.innerHeight) dy *= -1;

      bird.style.left = x + "px";
      bird.style.top = y + "px";
    };

    mask._interval = setInterval(tickBird, 16);

    const blockKey = (e) => {
      const blocked = ["Escape", "F11", "Alt", "Meta", "Control", "Tab"];
      if (blocked.includes(e.key) || e.key === " ") {
        e.preventDefault();
        e.stopPropagation();
      }
    };

    mask._blockKeyDown = (e) => blockKey(e);
    mask._blockKeyUp = (e) => blockKey(e);
    document.addEventListener("keydown", mask._blockKeyDown, { capture: true });
    document.addEventListener("keyup", mask._blockKeyUp, { capture: true });
  }

  function removeFullscreenTrap() {
    const mask = document.getElementById("birdFullscreenMask");
    if (!mask) return;
    if (mask._interval) clearInterval(mask._interval);
    if (mask._blockKeyDown) document.removeEventListener("keydown", mask._blockKeyDown, { capture: true });
    if (mask._blockKeyUp) document.removeEventListener("keyup", mask._blockKeyUp, { capture: true });
    mask.remove();
  }

  function handleFullscreenState() {
    if (isFullscreenNow()) {
      applyFullscreenTrap();
    } else {
      removeFullscreenTrap();
    }
  }

  document.addEventListener("fullscreenchange", handleFullscreenState);
  document.addEventListener("webkitfullscreenchange", handleFullscreenState);
  document.addEventListener("mozfullscreenchange", handleFullscreenState);
  window.addEventListener("resize", handleFullscreenState, { passive: true });
  window.addEventListener("orientationchange", handleFullscreenState, { passive: true });

  // The window bounces around the screen (only works in real pop-up windows)
  let dx = 12, dy = 8;
  setInterval(() => {
    try {
      let x = window.screenX + dx;
      let y = window.screenY + dy;
      if (x < 0 || x + window.outerWidth > screen.availWidth) dx = -dx;
      if (y < 0 || y + window.outerHeight > screen.availHeight) dy = -dy;
      window.moveBy(dx, dy);
    } catch (e) {
      // browser said no, the bird stays put
    }
  }, 8);
</script>
</body>
</html>
